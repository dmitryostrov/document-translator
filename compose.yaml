name: document-translator
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: translator
      POSTGRES_PASSWORD: translator-local
      POSTGRES_DB: translator
    restart: unless-stopped
    volumes: [pg:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U translator"]
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, "yes", --appendfsync, everysec, --maxmemory-policy, noeviction]
    restart: unless-stopped
    volumes: [redis:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 30
  api:
    build: .
    restart: unless-stopped
    ports: ["127.0.0.1:${APP_PORT:-3100}:3100"]
    environment: &appenv
      DATABASE_URL: postgres://translator:translator-local@postgres:5432/translator
      REDIS_URL: redis://redis:6379
      PROVIDER_MODE: ${PROVIDER_MODE:-openai}
      MODEL: ${MODEL:-gpt-6-astra}
      MCP_TOKEN_FILE: /auth/mcp-token
    volumes: [files:/data, tokens:/auth]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, bun, -e, "fetch('http://localhost:3100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 512m
  worker:
    build: .
    command: [bun, src/worker.ts]
    restart: unless-stopped
    environment:
      <<: *appenv
      OPENAI_API_KEY_FILE: /run/secrets/openai_key
    secrets: [openai_key]
    volumes: [files:/data, format-ipc:/ipc]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      parser: {condition: service_healthy}
    mem_limit: 1536m
    healthcheck:
      # The worker rewrites this file on every 5-second reconciler pass.
      test: [CMD, bun, -e, "try{process.exit(Date.now()-Number(require('fs').readFileSync('/tmp/worker-alive','utf8'))<30000?0:1)}catch{process.exit(1)}"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
  parser:
    build: .
    command: [bun, src/format-server.ts]
    restart: unless-stopped
    environment:
      PROVIDER_MODE: ${PROVIDER_MODE:-openai}
    volumes: [files:/data, format-ipc:/ipc]
    network_mode: none
    read_only: true
    tmpfs: ["/tmp:size=128m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1536m
    healthcheck:
      test: [CMD, bun, -e, "fetch('http://parser/health',{unix:'/ipc/format.sock'}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
  mcp:
    profiles: [mcp]
    image: ${COMPOSE_PROJECT_NAME:-document-translator}-api
    command: [bun, src/mcp.ts]
    stdin_open: true
    environment:
      API_URL: http://api:3100
      MCP_TOKEN_FILE: /auth/mcp-token
    volumes: [tokens:/auth:ro]
volumes:
  pg:
  redis:
  files:
  tokens:
  format-ipc:
secrets:
  openai_key:
    file: ${OPENAI_KEY_PATH:?OPENAI_KEY_UNAVAILABLE - set OPENAI_KEY_PATH to an external readable key file}
